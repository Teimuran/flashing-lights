spring:
  application:
    name: flashing-lights-bot

  # Подключение к PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/party_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Настройки JPA / Hibernate
  jpa:
    hibernate:
      # validate, чтобы таблицы не перетирались, так как у тебя есть Flyway
      ddl-auto: update
    show-sql: false

  # Миграции Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.springframework.beans.factory: DEBUG

bot:
  token: ${BOT_TOKEN}
  username: "flashingligths_bot"
  channel-username: "@flashinglightskrsk"
  channel-url: "https://t.me/flashinglightskrsk"

flat:
  api:
    base-url: "https://flat.audio/api"
    token: ${FLAT_API_TOKEN}
event:
  time: "22:00"
  zone-id: "Asia/Krasnoyarsk"